target-version = "py312"
line-length = 88
indent-width = 4

exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  ".mypy_cache",
  ".ruff_cache",
  ".pytest_cache",
]

[lint]
select = [
  "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "RET", "D", "C"
]
ignore = [
  "E501",
  "B008",
]
fixable = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
